        `appointments:Appointment[]`, `receptions:Reception[]`, `visits:Visit[]`. 연결 ID와 각 시각·상태로 시간표와 날짜별 목록
        구성. 예약 목록과 내원 목록에는 연결된 동일 환자가 각각 표시될 수 있으나 시간표에서는 연결된 예약·접수를 한 항목으로 합성. 한 의사 동일 시간 유효 예약 한 건; 현장 접수는
        별도. 페이지 번호 없음.


        반환 구간은 일요일=0부터 토요일=6까지 정수 요일을 사용한다.
