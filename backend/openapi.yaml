      description: >-
        **권한:** NURSE(본인 과)


        **원본 계약:** `receptionId`, `limit?`, `before?` → `NursingRecord[]`, `meta:{nextBefore,hasMore}`


        **업무 규칙:** 지정한 접수와 환자·본인 진료과를 검사. 같은 환자의 같은 진료과의 다른 날짜 접수 이력을 선택 접수보다 이전·이후 모두 포함하며 다른 진료과는 제외. 기록별
        `receptionId`, `receivedAt`, 최신 버전·작성자·작성 시각 반환. 이력은 과거→현재; `receptionId`로 현재 접수 기록을 구분하며 새 기록은 선택 접수에
        NUR-02로 저장.
      parameters:
        - name: patientId
          in: path
          required: true
          schema: *a2
        - name: receptionId
          in: query
          required: true
          schema: *a1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: before
          in: query
          required: false
          schema: *a1
      responses:
