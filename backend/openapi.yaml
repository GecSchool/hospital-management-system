  /doctors/{doctorId}/availability:
    get:
      tags:
        - 진료 시간·휴진
      operationId: SCH_01
      summary: 진료 가능 시간 조회
      description: >-
        **권한:** DOCTOR(본인), STAFF, NURSE(본인 과)


        **원본 계약:** → `{doctorId,intervalMinutes:20,weeklySlots:[{dayOfWeek,startTime,endTime}]}`


        **업무 규칙:** 요일 0=일요일~6=토요일의 매주 반복 구간을 반환한다. 구간은 요일 숫자와 시작 시각 오름차순이며 연속 구간은 합쳐 반환한다. 간호사는 본인 과. 관리 기능의
        관리자 접근은 §12.


        반환 구간은 일요일=0부터 토요일=6까지 정수 요일을 사용한다.
      parameters:
        - name: doctorId
          in: path
          required: true
          schema: *a2
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Availability"
                  meta:
                    type: object
                    nullable: true
                    enum:
                      - null
                    description: 번호형·커서 목록 외 일반 성공 응답의 meta는 null.
                required:
                  - data
                  - meta
              example:
                data:
                  doctorId: doc_01
                  intervalMinutes: 20
                  weeklySlots:
                    - dayOfWeek: 1
                      startTime: 09:00
                      endTime: 12:00
                    - dayOfWeek: 1
                      startTime: 13:00
                      endTime: 17:00
                meta: null
        "400":
          description: 입력 형식 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: 인증 필요 또는 실패
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: 권한 또는 상태 제한
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: 서버 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /doctors/me/availability:
    put:
      tags:
        - 진료 시간·휴진
      operationId: SCH_02
      summary: 내 진료 가능 시간 설정
      description: >-
        **권한:** DOCTOR


        **원본 계약:** `{weeklySlots:[{dayOfWeek,startTime,endTime}]}` → `200
        {doctorId,intervalMinutes:20,weeklySlots:[...]}`


        **업무 규칙:** 본인의 주간 시간표 전체 교체. 앞으로 남은 유효 예약과 충돌하면 `409 AVAILABILITY_CONFLICT`이며 기존 시간표를 유지한다. 날짜·시간 경계 및
        구간 규칙은 아래 참조. 성공 시 정규화된 전체 시간표를 반환한다.


        주간 시간표 전체를 교체한다. 빈 배열은 모든 진료 가능 시간 제거 요청이다. 중복·겹침은 400, 맞닿은 구간은 병합한다. 미래 유효 예약과 충돌하면 409로 전체 저장을 거부하고
        기존 시간표를 유지한다. 예약 생성과 충돌 검사를 같은 잠금 경계에서 원자적으로 수행한다.
      parameters: []
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Availability"
                  meta:
                    type: object
                    nullable: true
                    enum:
                      - null
                    description: 번호형·커서 목록 외 일반 성공 응답의 meta는 null.
                required:
                  - data
                  - meta
              example:
                data:
                  doctorId: doc_01
                  intervalMinutes: 20
                  weeklySlots:
                    - dayOfWeek: 1
                      startTime: 09:00
                      endTime: 12:00
                    - dayOfWeek: 1
                      startTime: 13:00
                      endTime: 17:00
                meta: null
        "400":
          description: "VALIDATION_ERROR: 요일 범위, 20분 경계, 시작·종료 순서 또는 중복·겹침 구간이 올바르지 않음."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: 인증 필요 또는 실패
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: 권한 또는 상태 제한
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "AVAILABILITY_CONFLICT: 미래 유효 예약이 변경된 시간표에 맞지 않아 저장하지 않음."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: 서버 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                weeklySlots:
                  type: array
                  items:
                    $ref: "#/components/schemas/WeeklySlot"
                  description: 전체 대체할 구간 목록. 선택하지 않은 요일·시간은 진료 불가. 빈 배열이면 모든 시간 제거 요청이며 미래 유효 예약과 충돌하면 거부된다.
              required:
                - weeklySlots
            example:
              weeklySlots:
                - dayOfWeek: 1
                  startTime: 09:00
                  endTime: 12:00
                - dayOfWeek: 1
                  startTime: 13:00
                  endTime: 17:00
