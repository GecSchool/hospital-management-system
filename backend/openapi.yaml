openapi: 3.0.3
info:
  title: 병원 진료 예약 및 환자 관리 시스템 API
  version: 0.1.0-draft
  description: >-
    초안: 구현 완료를 의미하지 않습니다. 미결 정책과 세부 사항은 원본 Markdown §12를 따릅니다. 시간대 Asia/Seoul; 날짜 YYYY-MM-DD, 일시는 오프셋 포함 ISO
    8601. 주민등록번호·기록·토큰을 URL이나 로그에 남기지 않습니다. 상태·권한·범위는 서버에서 검증합니다.


    화면 상태는 BOOKED, CANCELLED, REGISTERED, CALLED, IN_PROGRESS, COMPLETED를 사용합니다. 기록은 기록 ID+버전 번호로 관리하며 정정은 새
    버전을 생성합니다.


    번호형 목록의 page=1, size=20은 제안입니다. 커서 목록은 최신 묶음을 과거→현재로 반환하고 이전 묶음을 앞에 추가합니다. 서버에서 쿠키 이름과 CSRF 정책은 확정 필요.


    ### 무결성과 동시성 설계 기준


    - 진료 담당 의사는 접수의 의사로만 결정한다. 별도의 `visit.doctorId`를 권위 데이터로 쓰지 않는다. 접수 생성 후 담당 의사는 변경하지 않는다.

    - 진료과는 의사 소속이 바뀌어도 과거 접수에 기록된 당시 진료과를 사용한다. 진료 완료 후 의사 변경을 막아 과거 기록의 담당 의사가 바뀌지 않게 한다.

    - 예약 가능 시간 조회 후 실제 저장까지 상황이 바뀔 수 있다. 저장·변경 시 근무시간, 휴진, 활성 상태와 같은 의사·시간의 유효 예약 한 건 제한을 원자적으로 재검사한다.

    - 휴진 신청과 예약 등록, 진료 가능 시간 변경과 예약 등록의 동시 요청에도 충돌 규칙이 깨지지 않게 잠금/제약 전략을 논리·물리 모델에서 확정한다.

    - 한 의사당 입실 전 호출은 하나만 유지한다. 진료 중인지 확인하는 절차, 기존 호출 자동 해제와 새 호출을 같은 잠금 경계에서 원자적으로 처리한다. 진료 중에는 추가 호출을 막고 입실
    확인 시 현재 호출과 진행 중 진료를 재검사한다. 수동 호출 취소는 없지만 삭제가 허용된 호출 접수의 삭제 시 호출은 해제한다.

    - 접수 삭제와 간호 기록 생성이 동시에 발생해도 기록이 있는 접수가 삭제되지 않도록 두 요청의 확인·저장을 동일한 잠금 경계에서 처리한다. 같은 환자·의사·날짜의 중복 미완료 접수 검사와
    생성도 원자적으로 처리한다.

    - 원본·정정 버전은 삭제/덮어쓰기하지 않는다. `baseVersionNo`로 최신 버전 정정 여부를 확인하고 `(recordId,versionNo)` 유일성과 동시 저장 충돌을 처리한다.
    간호 기록과 진료 기록의 버전은 서로 독립적이다.

    - 활성 관리자 수 검사와 비활성화는 동시 요청까지 고려해 원자적으로 수행한다. 관리자 역할이 아닌 계정은 관리자 권한을 얻을 수 없다.

    - 보호 정보의 목록·상세 노출 필드는 역할별 최소 범위를 적용한다. 민감 정보·토큰·비밀번호는 로그에 기록하지 않으며, 주요 계정 상태 변경과 기록 정정의 수행자·시각은 추적할 수 있도록
    설계한다.


    직원 계정의 소속은 진료과로 관리하지 않으며 계정 목록에서 `-`로 표시한다. 계정 검색 조건을 전부 비우면 전체 계정을 반환하고, 일부만 입력하면 해당 조건만 적용한다. 로그인 중인 관리자
    자신의 계정 상태 변경도 동일하게 검사한다.


    ### 결정하지 않은 사항과 확정 정책의 경계


    확정 정책은 위에 반영했으며, 아래 항목은 임의로 확정하지 않는다.


    1. **진료 중 추가 호출:** 같은 의사가 진료 중일 때 호출을 차단한다. 입실 확인에서도 동시 진료 금지 규칙을 검증한다.

    2. **접수 삭제 세부:** 간호 기록이 있거나 진료가 시작된 접수는 삭제 불가. 호출됨 상태도 이 조건을 만족하면 삭제할 수 있고 호출이 해제된다. 물리 삭제/취소 이력 보존 방식은
    미정.

    3. **간호 기록 시간 범위:** 같은 환자의 같은 과 기록은 선택 접수의 전후를 모두 조회한다. 선택 접수 표시와 새 기록의 연결 대상은 해당 `receptionId`를 기준으로 한다.

    4. **예약 환자 검색:** 간호사는 전체 환자를 검색할 수 있으며 예약 등록은 본인 과만 가능, 변경·취소는 불가.

    5. **접수 담당 의사 변경:** 화면 범위에서 제외하며 접수 생성 후에는 담당 의사를 변경하지 않는다.

    6. **미내원·예약 우선순위:** 미내원 상태 및 예약 환자 자동 우선순위는 제공하지 않는다. 간호사가 호출 대상을 선택한다.

    7. **예약 시간 변경 화면:** `excludeAppointmentId`로 변경 대상 예약만 점유 검사에서 제외하고 현재 시각을 선택 표시한다. 변경이 없으면 저장 버튼을 비활성화한다.
    `reason` 값 목록은 미정. 동일 의사·동일 시간에는 예약 한 건만 허용하고 현장 접수 인원까지 제한하지 않는다.

    8. **진료과 삭제:** 의료진 외 예약·접수·진료 이력 중 삭제 제한에 포함할 참조 범위 미정. 과 이름은 과거에도 현재 이름으로 표시.

    9. **의사 미처리 업무:** 오늘 이후 미접수 유효 예약 및 미완료 접수·진료가 있으면 계정 비활성화·소속 변경을 제한한다. 지난 날짜의 미접수 예약은 제한하지 않는다. 비활성 계정도
    비밀번호를 재설정할 수 있으나 자동 활성화되지는 않는다.

    10. **환자 주민등록번호:** 추가 필수값·변경 허용·중복 검사·보호 저장 정책 미정. 미변경 시 생략, 응답 마스킹.

    11. **관리자 목록·초대:** 별도 검색 조건과 활성 계정 집계는 확정. SMTP 요청 실패 후 재시도·Redis/DB 실패 복구는 구현 전에 정한다.

    12. **인증 세부:** 세션 저장소·만료·CSRF·실패 횟수·토큰 유효기간, 메일과 Redis/DB 간 실패 복구 정책 미정.

    13. **기록 정정:** 대리 정정은 제공하지 않는다. 진료 기록은 담당 의사, 간호 기록은 최초 작성자 본인만 정정한다.

    14. **목록 응답 세부:** 진료과 목록과 의사 일간 환자 목록의 최대 반환량, 기록 조회 시 환자 접근 맥락 전달 방식은 구현 전 구체화한다.




    ### 화면 상태 합성 규칙


    화면용 `displayStatus`는 목록·필터·상세에서 동일하게 사용한다. 취소된 예약은 `CANCELLED`(예약 취소), 유효한 접수가 없는 예약은 `BOOKED`(예약), 유효한
    접수는 진료 완료 `COMPLETED`(진료 완료) → 진료 중 `IN_PROGRESS`(진료 중) → 호출 `CALLED`(호출됨) → 접수 완료 `REGISTERED`(접수 완료) 순으로
    연결된 가장 진행된 상태를 표시한다. 현장 접수에도 동일한 접수 이후 상태를 쓴다. `status` 필터는 이 화면용 값을 기준으로 한다. 접수 삭제 시에는 삭제된 접수를 상태 합성에서
    제외한다. 별도 미내원 상태는 제공하지 않는다.
servers:
  - url: /api/v1
    description: 동일 출처 개발 서버
tags:
  - name: 인증
  - name: 계정
  - name: 진료과·의료진
  - name: 진료 시간·휴진
  - name: 환자
  - name: 예약
  - name: 접수·호출
  - name: 진료 기록
  - name: 간호 기록
  - name: 대시보드·일정
security:
  - sessionCookie: []
paths:
  /auth/login:
    post:
      tags:
        - 인증
      operationId: AUTH_01
      summary: 로그인
      description: |-
        **권한:** 공개

        **원본 계약:** body `{email,password}` → `200 AccountSummary`, 세션 쿠키

        **업무 규칙:** `401 INVALID_CREDENTIALS`; 비활성은 `403 ACCOUNT_INACTIVE`; 시도 제한 `429`.
      parameters: []
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/SelfAccount"
                  meta:
                    type: object
                    nullable: true
                    enum:
                      - null
                    description: 번호형·커서 목록 외 일반 성공 응답의 meta는 null.
                required:
                  - data
                  - meta
          headers:
            Set-Cookie:
              required: true
              description: 로그인 성공 시 세션 쿠키. 이름과 속성의 실제 설정은 구현 전 확정한다.
              schema:
                type: string
        "400":
          description: 입력 형식 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "`401 INVALID_CREDENTIALS`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "`403 ACCOUNT_INACTIVE`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: 요청 제한
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: 서버 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
              required:
                - email
                - password
  /auth/logout:
    post:
      tags:
        - 인증
      operationId: AUTH_02
      summary: 로그아웃
      description: |-
        **권한:** 공통

        **원본 계약:** body 없음 → `204`

        **업무 규칙:** 현재 세션 무효화. 이미 만료된 세션 처리의 멱등성은 구현 시 통일.
      parameters: []
      responses:
        "204":
          description: 성공 — 응답 본문 없음
        "400":
          description: 입력 형식 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: 인증 필요 또는 실패
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: 권한 또는 상태 제한
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: 서버 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/me:
    get:
      tags:
        - 인증
      operationId: AUTH_03
      summary: 내 계정 조회
      description: |-
        **권한:** 공통

        **원본 계약:** → `200 AccountSummary`

        **업무 규칙:** `401`, `403 ACCOUNT_INACTIVE`.
      parameters: []
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/SelfAccount"
                  meta:
                    type: object
                    nullable: true
                    enum:
                      - null
                    description: 번호형·커서 목록 외 일반 성공 응답의 meta는 null.
                required:
                  - data
                  - meta
        "400":
          description: 입력 형식 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: 인증 필요 또는 실패
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "`403 ACCOUNT_INACTIVE`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: 서버 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/invitations/verify:
    post:
      tags:
        - 인증
      operationId: AUTH_04
      summary: 초대 링크 검증
      description: |-
        **권한:** 공개

        **원본 계약:** body `{token}` → `200 {name,email,role,department}`

        **업무 규칙:** `410 INVITATION_INVALID`; 토큰 원문을 URL에 다시 노출하지 않음.
      parameters: []
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      name: &a1
                        type: string
                      email:
                        type: string
                        format: email
                      role:
                        $ref: "#/components/schemas/Role"
                      department:
                        description: 소속 진료과가 없으면 null.
                        anyOf:
                          - $ref: "#/components/schemas/DepartmentSummary"
                          - type: object
                            nullable: true
                            enum:
                              - null
                    required:
                      - name
                      - email
                      - role
                      - department
                  meta:
                    type: object
                    nullable: true
                    enum:
                      - null
                    description: 번호형·커서 목록 외 일반 성공 응답의 meta는 null.
                required:
                  - data
                  - meta
        "400":
          description: 입력 형식 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: "`410 INVITATION_INVALID`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: 서버 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token: *a1
              required:
                - token
  /auth/invitations/accept:
    post:
      tags:
        - 인증
      operationId: AUTH_05
      summary: 초대 수락 및 계정 생성
      description: |-
        **권한:** 공개

        **원본 계약:** body `{token,password,passwordConfirm}` → `201 {accountId}`

        **업무 규칙:** 만료·사용됨 `410`; 불일치 `422 PASSWORD_MISMATCH`; 계정 중복 `409`. 초대 소비와 계정 생성의 실패 복구 필요.
      parameters: []
      responses:
        "201":
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      accountId: &a2
                        type: string
                        description: 불투명 리소스 ID
                    required:
                      - accountId
                  meta:
                    type: object
                    nullable: true
                    enum:
                      - null
                    description: 번호형·커서 목록 외 일반 성공 응답의 meta는 null.
                required:
                  - data
                  - meta
        "400":
          description: 입력 형식 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: 업무 상태 충돌
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: 링크 만료 또는 사용됨
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: "`422 PASSWORD_MISMATCH`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: 서버 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token: *a1
                password:
                  type: string
                  format: password
                passwordConfirm:
                  type: string
                  format: password
              required:
                - token
                - password
                - passwordConfirm
  /auth/password-resets/verify:
    post:
      tags:
        - 인증
      operationId: AUTH_06
