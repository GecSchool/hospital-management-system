components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: connect.sid
      description: 세션 쿠키 이름은 Express 기본값을 예시로 사용하며 최종 설정은 미정입니다.
  schemas:
    Role:
      type: string
      enum:
        - STAFF
        - DOCTOR
        - NURSE
        - ADMIN
    AccountStatus:
      type: string
      enum:
        - ACTIVE
        - INACTIVE
    DisplayStatus:
      type: string
      enum:
        - BOOKED
        - CANCELLED
        - REGISTERED
        - CALLED
        - IN_PROGRESS
        - COMPLETED
      description: 목록·상세·필터의 공통 표시 상태. 예약·접수·진료의 합성 우선순위는 문서 상단 화면 상태 합성 규칙 참조.
    DepartmentSummary:
      type: object
      properties:
        id: *a2
        name: *a1
        status:
          $ref: "#/components/schemas/AccountStatus"
      required:
        - id
        - name
        - status
    AccountSummary:
      type: object
      properties:
        id: *a2
        name: *a1
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/Role"
        status:
          $ref: "#/components/schemas/AccountStatus"
        department:
          description: 소속 진료과가 없으면 null.
          anyOf:
            - $ref: "#/components/schemas/DepartmentSummary"
            - type: object
              nullable: true
              enum:
                - null
        doctorId:
          type: string
          description: 본인 인증 응답에서 의사는 필수, 그 외 역할은 null. 계정 ID와 구분한다.
          nullable: true
      required:
        - id
        - name
        - email
        - role
        - status
        - department
    DoctorSummary:
      type: object
      properties:
        id: *a2
        name: *a1
        department:
          $ref: "#/components/schemas/DepartmentSummary"
      required:
        - id
        - name
        - department
    PatientSummary:
      type: object
      properties:
        id: *a2
        patientNumber:
          type: string
          description: 직원 응답에는 필수. 간호사 화면에서는 표시·검색하지 않는다.
        name: *a1
        birthDate: *a4
        phone: *a1
      required:
        - id
        - name
        - birthDate
        - phone
    PatientDetail:
      allOf:
        - $ref: "#/components/schemas/PatientSummary"
        - type: object
          properties:
            maskedResidentNumber: *a1
          required:
            - maskedResidentNumber
    Appointment:
      type: object
      properties:
        id: *a2
        patient:
          $ref: "#/components/schemas/PatientSummary"
        doctor:
          $ref: "#/components/schemas/DoctorSummary"
        department:
          $ref: "#/components/schemas/DepartmentSummary"
        startsAt: *a5
        status:
          type: string
          enum:
            - BOOKED
            - CANCELLED
        displayStatus:
          $ref: "#/components/schemas/DisplayStatus"
        registeredBy:
          $ref: "#/components/schemas/AccountSummary"
        receptionId:
          type: string
          description: 불투명 리소스 ID
          nullable: true
        cancelledAt:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - patient
        - doctor
        - department
        - startsAt
        - status
        - displayStatus
        - registeredBy
    Reception:
      type: object
      properties:
        id: *a2
        patient:
          $ref: "#/components/schemas/PatientSummary"
        department:
          $ref: "#/components/schemas/DepartmentSummary"
        doctor:
          $ref: "#/components/schemas/DoctorSummary"
        appointmentId:
          type: string
          description: 불투명 리소스 ID
          nullable: true
        receivedAt: *a5
        status:
          type: string
          enum:
            - REGISTERED
            - CALLED
            - CANCELLED
        displayStatus:
          $ref: "#/components/schemas/DisplayStatus"
        visitId:
          type: string
          description: 불투명 리소스 ID
          nullable: true
        visitStatus:
          type: string
          nullable: true
          enum:
            - IN_PROGRESS
            - COMPLETED
            - null
      required:
        - id
        - patient
        - department
        - doctor
        - receivedAt
        - status
        - displayStatus
    Visit:
      type: object
      properties:
        id: *a2
        receptionId: *a2
        patient:
          $ref: "#/components/schemas/PatientSummary"
        department:
          $ref: "#/components/schemas/DepartmentSummary"
        doctor:
          $ref: "#/components/schemas/DoctorSummary"
        status:
          type: string
          enum:
            - IN_PROGRESS
            - COMPLETED
        startedAt: *a5
        completedAt:
          type: string
          format: date-time
          nullable: true
        clinicalRecordId:
          type: string
          description: 불투명 리소스 ID
          nullable: true
      required:
        - id
        - receptionId
        - patient
        - department
        - doctor
        - status
        - startedAt
    ClinicalRecordVersion:
      type: object
      properties:
        id: *a2
        recordId: *a2
        versionNo:
          type: integer
          minimum: 1
        symptoms: *a1
        diagnosis: *a1
        opinion: *a1
        correctionReason:
          type: string
          nullable: true
          description: 원본(versionNo 1)은 null, 정정(versionNo 2 이상)은 사유 문자열.
        author:
          $ref: "#/components/schemas/AccountSummary"
        createdAt: *a5
      required:
        - id
        - recordId
        - versionNo
        - symptoms
        - diagnosis
        - opinion
        - correctionReason
        - author
        - createdAt
      anyOf:
        - description: 원본 기록
          type: object
          properties:
            versionNo:
              type: integer
              enum:
                - 1
            correctionReason:
              type: string
              nullable: true
              enum:
                - null
          required:
            - versionNo
            - correctionReason
        - description: 정정 기록
          type: object
          properties:
            versionNo:
              type: integer
              minimum: 2
            correctionReason:
              type: string
          required:
            - versionNo
            - correctionReason
    NursingRecordVersion:
      type: object
      properties:
        id: *a2
        recordId: *a2
        versionNo:
          type: integer
          minimum: 1
        content: *a1
        correctionReason:
          type: string
          nullable: true
          description: 원본(versionNo 1)은 null, 정정(versionNo 2 이상)은 사유 문자열.
        author:
          $ref: "#/components/schemas/AccountSummary"
        createdAt: *a5
      required:
        - id
        - recordId
        - versionNo
        - content
        - correctionReason
        - author
        - createdAt
      anyOf:
        - description: 원본 기록
          type: object
          properties:
            versionNo:
              type: integer
              enum:
                - 1
            correctionReason:
              type: string
              nullable: true
              enum:
                - null
          required:
            - versionNo
            - correctionReason
        - description: 정정 기록
          type: object
          properties:
            versionNo:
              type: integer
              minimum: 2
            correctionReason:
              type: string
          required:
            - versionNo
            - correctionReason
    VersionSummary:
      type: object
      properties:
        id: *a2
        versionNo:
          type: integer
          minimum: 1
        author:
          $ref: "#/components/schemas/AccountSummary"
        createdAt: *a5
      required:
        - id
        - versionNo
        - author
        - createdAt
    ClinicalRecord:
      type: object
      properties:
        id: *a2
        visitId: *a2
        latestVersion:
          $ref: "#/components/schemas/ClinicalRecordVersion"
        versions:
          type: array
          items:
            $ref: "#/components/schemas/VersionSummary"
      required:
        - id
        - visitId
        - latestVersion
        - versions
    NursingRecord:
      type: object
      properties:
        id: *a2
        receptionId: *a2
        receivedAt: *a5
        author:
          $ref: "#/components/schemas/AccountSummary"
        createdAt: *a5
        latestVersion:
          $ref: "#/components/schemas/NursingRecordVersion"
      required:
        - id
        - receptionId
        - author
        - createdAt
        - latestVersion
    NursingRecordDetail:
      type: object
      properties:
        id: *a2
        receptionId: *a2
        latestVersion:
          $ref: "#/components/schemas/NursingRecordVersion"
        versions:
          type: array
          items:
            $ref: "#/components/schemas/VersionSummary"
      required:
        - id
        - receptionId
        - latestVersion
        - versions
    WeeklySlot:
      type: object
      properties:
        dayOfWeek:
          type: integer
          minimum: 0
          maximum: 6
          enum:
            - 0
            - 1
            - 2
            - 3
            - 4
            - 5
            - 6
          description: 병원 업무 시간대 Asia/Seoul 기준. 0=일요일, 1=월요일, 2=화요일, 3=수요일, 4=목요일, 5=금요일, 6=토요일.
          example: 1
        startTime:
          type: string
          pattern: ^([01][0-9]|2[0-3]):(00|20|40)$
          description: 포함되는 시작 시각. 00:00~23:40의 20분 경계.
          example: 09:00
        endTime:
          type: string
          pattern: ^(([01][0-9]|2[0-3]):(00|20|40)|24:00)$
          description: 포함되지 않는 종료 시각. 00:20~24:00의 20분 경계; 24:00은 종료에만 사용.
          example: 12:00
      required:
        - dayOfWeek
        - startTime
        - endTime
      description: Asia/Seoul 기준 매주 반복되는 진료 가능 구간. 시작 포함·종료 제외 [startTime,endTime). 시작·종료는 20분 단위, 종료가 시작보다 늦어야 한다.
        같은 요일의 중복·겹침 구간은 거부하고 맞닿은 구간은 병합한다. 날짜를 넘기는 구간은 요일별로 나눈다.
    Availability:
      type: object
      properties:
        doctorId: *a2
        intervalMinutes:
          type: integer
          enum:
            - 20
        weeklySlots:
          type: array
          items:
            $ref: "#/components/schemas/WeeklySlot"
      required:
        - doctorId
        - intervalMinutes
        - weeklySlots
    Leave:
      type: object
      properties:
        id: *a2
        date: *a4
      required:
        - id
        - date
    AppointmentSlots:
      type: object
      properties:
        date: *a4
        intervalMinutes:
          type: integer
          enum:
            - 20
        slots:
          type: array
          items:
            type: object
            properties:
              startsAt: *a5
              available:
                type: boolean
              reason:
                type: string
                nullable: true
                description: 불가 사유 코드 목록 미정
            required:
              - startsAt
              - available
      required:
        - date
        - intervalMinutes
        - slots
    DoctorPatientRow:
      type: object
      properties:
        patient:
          $ref: "#/components/schemas/PatientSummary"
        appointmentId:
          type: string
          description: 불투명 리소스 ID
