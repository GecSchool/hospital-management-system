    get:
      tags:
        - 환자
      operationId: PAT_01
      summary: 환자 목록 검색
      description: >-
        **권한:** STAFF, NURSE


        **원본 계약:** `name?`, `birthDate?`, `phone?`, `patientNumber?`, `page?`, `size?` → `PatientSummary[]`


        **업무 규칙:** 간호사는 예약 환자 선택 시 전체 환자를 이름·생년월일·연락처로 검색할 수 있음. 조건 생략 시 전체 첫 페이지. 간호사에게 환자번호 검색·표시는 제공하지 않음.
        예약은 본인 과에만 등록 가능.
      parameters:
        - name: name
          in: query
          required: false
          schema: *a1
        - name: birthDate
          in: query
          required: false
          schema: *a4
        - name: phone
          in: query
          required: false
          schema: *a1
        - name: patientNumber
          in: query
          required: false
          schema: *a1
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          description: "기본값 제안: 1"
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          description: "기본값 제안: 20"
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    description: STAFF 응답의 각 항목은 StaffPatientSummary를 만족한다. NURSE 응답은 PatientSummary를 사용한다. 역할은 응답 본문이 아닌 세션으로
                      결정되므로 anyOf만으로 역할별 조건을 검증할 수 없다.
                    anyOf:
                      - type: array
                        items:
                          $ref: "#/components/schemas/StaffPatientSummary"
                      - type: array
                        items:
                          $ref: "#/components/schemas/PatientSummary"
                  meta:
                    $ref: "#/components/schemas/PageMeta"
                required:
                  - data
                  - meta
              example:
                data:
                  - id: pat_01
